<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">The Inter-House Cricket Match</title>
  <desc id="d">A school cricket match: a batsman in white swings at the ball, the bowler has just bowled, the wicketkeeper crouches behind the stumps, an umpire in a hat watches, a fielder runs, the scoreboard shows 124 for 3 after 18 overs, and students cheer under a tree with a "Go Blue House" banner.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc8f8"/><stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="90" cy="70" r="36" fill="#ffd54f"/>
  <!-- school building -->
  <rect x="250" y="120" width="330" height="110" fill="#ffe0b2"/>
  <polygon points="240,120 415,70 590,120" fill="#c62828"/>
  <g fill="#90caf9">
    <rect x="270" y="150" width="40" height="40"/><rect x="330" y="150" width="40" height="40"/>
    <rect x="460" y="150" width="40" height="40"/><rect x="520" y="150" width="40" height="40"/>
  </g>
  <rect x="395" y="160" width="40" height="70" fill="#8d6e63"/>
  <!-- field -->
  <rect y="220" width="800" height="380" fill="#66bb6a"/>
  <ellipse cx="400" cy="420" rx="80" ry="150" fill="#d7c48a" transform="rotate(90 400 420)"/>

  <!-- scoreboard -->
  <rect x="610" y="90" width="170" height="120" rx="6" fill="#263238"/>
  <text x="695" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">BLUE HOUSE</text>
  <text x="695" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffeb3b">124 / 3</text>
  <text x="695" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#b0bec5">Overs 18 · Target 150</text>
  <rect x="680" y="210" width="12" height="20" fill="#455a64"/>

  <!-- tree + spectators + banner -->
  <rect x="45" y="250" width="22" height="90" fill="#6d4c41"/>
  <circle cx="56" cy="230" r="58" fill="#2e7d32"/><circle cx="20" cy="250" r="34" fill="#388e3c"/><circle cx="100" cy="250" r="36" fill="#388e3c"/>
  <rect x="8" y="330" width="190" height="34" rx="4" fill="#1565c0"/>
  <text x="103" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">GO BLUE HOUSE!</text>
  <g>
    <circle cx="40" cy="385" r="16" fill="#8d5a3b"/><rect x="26" y="400" width="28" height="36" rx="8" fill="#ffffff"/>
    <rect x="50" y="378" width="8" height="24" rx="4" fill="#8d5a3b" transform="rotate(-30 54 390)"/>
    <circle cx="90" cy="385" r="16" fill="#c68e5f"/><rect x="76" y="400" width="28" height="36" rx="8" fill="#ffffff"/>
    <circle cx="140" cy="385" r="16" fill="#a86b45"/><rect x="126" y="400" width="28" height="36" rx="8" fill="#ffffff"/>
    <rect x="152" y="372" width="8" height="26" rx="4" fill="#a86b45" transform="rotate(25 156 385)"/>
    <circle cx="185" cy="388" r="15" fill="#8d5a3b"/><rect x="172" y="402" width="26" height="34" rx="8" fill="#ffffff"/>
  </g>

  <!-- stumps (batting end) -->
  <g fill="#fff3e0" stroke="#bf8f5a" stroke-width="2">
    <rect x="455" y="420" width="6" height="56"/><rect x="465" y="420" width="6" height="56"/><rect x="475" y="420" width="6" height="56"/>
  </g>
  <!-- batsman swinging -->
  <circle cx="430" cy="350" r="20" fill="#a86b45"/>
  <path d="M410 345 q20 -30 40 0 l0 -6 q-20 -14 -40 0z" fill="#1565c0"/>
  <rect x="408" y="368" width="44" height="62" rx="10" fill="#ffffff"/>
  <rect x="412" y="428" width="16" height="52" fill="#ffffff" stroke="#e0e0e0"/><rect x="432" y="428" width="16" height="52" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="404" y="430" width="22" height="40" rx="5" fill="#eeeeee"/>
  <rect x="385" y="320" width="12" height="80" rx="4" fill="#e6c48f" transform="rotate(-55 391 360)"/>
  <!-- ball in the air -->
  <circle cx="330" cy="300" r="7" fill="#c62828"/>
  <path d="M300 320 q14 -10 26 -18" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- wicketkeeper crouching -->
  <circle cx="530" cy="430" r="17" fill="#8d5a3b"/>
  <rect x="512" y="446" width="38" height="34" rx="10" fill="#ffffff"/>
  <rect x="500" y="452" width="16" height="12" rx="5" fill="#ff7043"/><rect x="546" y="452" width="16" height="12" rx="5" fill="#ff7043"/>
  <rect x="514" y="478" width="14" height="22" fill="#ffffff" stroke="#e0e0e0"/><rect x="534" y="478" width="14" height="22" fill="#ffffff" stroke="#e0e0e0"/>

  <!-- umpire with hat (far end) -->
  <circle cx="250" cy="330" r="17" fill="#c68e5f"/>
  <ellipse cx="250" cy="316" rx="26" ry="7" fill="#fafafa"/><rect x="238" y="302" width="24" height="14" rx="5" fill="#fafafa"/>
  <rect x="232" y="346" width="36" height="58" rx="8" fill="#eceff1"/>
  <rect x="236" y="402" width="12" height="42" fill="#37474f"/><rect x="252" y="402" width="12" height="42" fill="#37474f"/>
  <!-- bowler after delivery -->
  <circle cx="300" cy="372" r="18" fill="#8d5a3b"/>
  <rect x="282" y="389" width="36" height="52" rx="10" fill="#ffffff"/>
  <rect x="312" y="380" width="10" height="38" rx="5" fill="#8d5a3b" transform="rotate(-50 317 399)"/>
  <rect x="284" y="438" width="13" height="44" fill="#ffffff" stroke="#e0e0e0" transform="rotate(12 290 460)"/>
  <rect x="303" y="438" width="13" height="44" fill="#ffffff" stroke="#e0e0e0" transform="rotate(-18 309 460)"/>

  <!-- fielder running -->
  <circle cx="660" cy="300" r="16" fill="#a86b45"/>
  <rect x="644" y="315" width="32" height="44" rx="9" fill="#ffffff"/>
  <rect x="646" y="356" width="12" height="40" fill="#ffffff" stroke="#e0e0e0" transform="rotate(25 652 376)"/>
  <rect x="662" y="356" width="12" height="40" fill="#ffffff" stroke="#e0e0e0" transform="rotate(-25 668 376)"/>
  <rect x="672" y="318" width="9" height="32" rx="4" fill="#a86b45" transform="rotate(-60 676 334)"/>
</svg>
