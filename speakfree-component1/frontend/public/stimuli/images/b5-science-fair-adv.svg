<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">A school science fair: a student explains a solar-panel model to two judges, a nervous student practises notes, another project's volcano erupts and parents take photos</title>
  <rect width="640" height="400" fill="#EEF2F7"/>
  <rect y="310" width="640" height="90" fill="#C9D3DF"/>
  <rect x="160" y="20" width="320" height="40" rx="6" fill="#1E3A8A"/>
  <text x="222" y="47" font-family="sans-serif" font-size="20" fill="#FFF">SCIENCE FAIR 2026</text>
  <!-- table 1: solar model -->
  <rect x="40" y="230" width="200" height="14" fill="#8B5A2B"/><rect x="50" y="244" width="10" height="66" fill="#8B5A2B"/><rect x="220" y="244" width="10" height="66" fill="#8B5A2B"/>
  <rect x="70" y="120" width="140" height="80" fill="#FFF" stroke="#999"/>
  <text x="84" y="146" font-family="sans-serif" font-size="13" fill="#1B2559">Solar power</text><text x="84" y="166" font-family="sans-serif" font-size="13" fill="#1B2559">for rural schools</text>
  <polygon points="90,230 150,200 190,230" fill="#3A86FF" stroke="#1E3A8A"/>
  <!-- presenter -->
  <circle cx="270" cy="178" r="18" fill="#8D5524"/><path d="M254 196 h32 l8 64 h-48z" fill="#FFF"/><rect x="262" y="196" width="16" height="64" fill="#1E3A8A"/>
  <line x1="256" y1="206" x2="226" y2="190" stroke="#8D5524" stroke-width="7" stroke-linecap="round"/>
  <!-- judges -->
  <circle cx="350" cy="182" r="18" fill="#C68642"/><path d="M334 200 h32 l6 70 h-44z" fill="#555"/>
  <rect x="368" y="214" width="20" height="26" fill="#FFF" stroke="#999"/>
  <circle cx="400" cy="186" r="17" fill="#B9773E"/><path d="M384 203 h32 l6 66 h-44z" fill="#7C6CF0"/>
  <!-- table 2: volcano -->
  <rect x="440" y="250" width="180" height="14" fill="#8B5A2B"/><rect x="450" y="264" width="10" height="46" fill="#8B5A2B"/><rect x="600" y="264" width="10" height="46" fill="#8B5A2B"/>
  <polygon points="490,250 530,180 570,250" fill="#8B5A2B"/>
  <path d="M530 180 q-20 -40 -6 -70 q14 30 6 70z M530 180 q24 -36 10 -66 q-14 30 -10 66z" fill="#E8453C"/>
  <g fill="#FFB703"><circle cx="512" cy="120" r="5"/><circle cx="550" cy="112" r="5"/></g>
  <!-- nervous student -->
  <circle cx="600" cy="196" r="15" fill="#C68642"/><path d="M586 211 h28 l6 38 h-40z" fill="#2EC4B6"/>
  <rect x="578" y="214" width="14" height="18" fill="#FFF" stroke="#999"/>
  <text x="612" y="186" font-family="sans-serif" font-size="16" fill="#1B2559">?</text>
  <!-- parent with camera -->
  <circle cx="470" cy="330" r="16" fill="#8D5524"/><path d="M456 346 h28 v54 h-28z" fill="#F72585"/>
  <rect x="482" y="332" width="20" height="14" rx="3" fill="#333"/><circle cx="492" cy="339" r="4" fill="#9AD1FF"/>
</svg>
