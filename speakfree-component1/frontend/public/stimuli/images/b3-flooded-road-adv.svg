<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">After heavy rain a tuk-tuk is stuck in a flooded road; two people push it, a girl watches from a shop doorway and a blocked drain is full of rubbish</title>
  <rect width="640" height="400" fill="#8FA3B8"/>
  <g fill="#6B7C8F"><ellipse cx="140" cy="50" rx="110" ry="34"/><ellipse cx="420" cy="40" rx="150" ry="36"/></g>
  <g stroke="#DDE7F2" stroke-width="2"><line x1="80" y1="90" x2="70" y2="110"/><line x1="200" y1="95" x2="190" y2="115"/><line x1="330" y1="88" x2="320" y2="108"/><line x1="470" y1="96" x2="460" y2="116"/><line x1="580" y1="90" x2="570" y2="110"/></g>
  <!-- shop -->
  <rect x="20" y="120" width="180" height="180" fill="#F2D49B"/><rect x="20" y="120" width="180" height="30" fill="#E8453C"/>
  <text x="44" y="142" font-family="sans-serif" font-size="16" fill="#FFF">KADE</text>
  <rect x="80" y="200" width="60" height="100" fill="#8B5A2B"/>
  <circle cx="110" cy="220" r="14" fill="#8D5524"/><path d="M96 236 h28 l6 40 h-40z" fill="#2EC4B6"/>
  <!-- water -->
  <rect y="280" width="640" height="120" fill="#5B7FA3"/>
  <g stroke="#A9C4E0" stroke-width="2" fill="none"><path d="M40 320 q20 -8 40 0 q20 8 40 0"/><path d="M380 350 q20 -8 40 0 q20 8 40 0"/><path d="M520 310 q20 -8 40 0"/></g>
  <!-- tuk-tuk -->
  <path d="M300 230 h130 q30 0 30 30 v40 h-180 v-50 q0 -20 20 -20z" fill="#2E7D32"/>
  <rect x="320" y="240" width="40" height="30" fill="#BDE6FF"/><rect x="380" y="240" width="50" height="30" fill="#BDE6FF"/>
  <path d="M290 230 h150 l-10 -14 h-130z" fill="#1B5E20"/>
  <circle cx="320" cy="300" r="16" fill="#222"/><circle cx="440" cy="300" r="16" fill="#222"/>
  <rect x="280" y="292" width="200" height="20" fill="#5B7FA3" opacity=".85"/>
  <!-- two people pushing -->
  <circle cx="500" cy="220" r="16" fill="#C68642"/><path d="M486 236 h28 l-6 52 h-24z" fill="#3A86FF"/>
  <line x1="488" y1="244" x2="464" y2="254" stroke="#C68642" stroke-width="7" stroke-linecap="round"/>
  <circle cx="540" cy="226" r="16" fill="#8D5524"/><path d="M526 242 h28 l-4 46 h-22z" fill="#FFB703"/>
  <line x1="528" y1="250" x2="506" y2="258" stroke="#8D5524" stroke-width="7" stroke-linecap="round"/>
  <!-- blocked drain -->
  <rect x="220" y="282" width="50" height="12" fill="#444"/>
  <g><rect x="226" y="270" width="12" height="14" fill="#E8453C"/><ellipse cx="252" cy="276" rx="10" ry="6" fill="#FFF"/><rect x="240" y="266" width="8" height="12" fill="#2EC4B6"/></g>
</svg>
