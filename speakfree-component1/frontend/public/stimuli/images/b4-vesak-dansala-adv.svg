<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">A Vesak dansala at night: volunteers serve free food from a stall under lanterns, people queue, a child helps carry cups and a lantern pandal glows behind</title>
  <rect width="640" height="400" fill="#1D2B53"/>
  <g fill="#FFF"><circle cx="60" cy="40" r="2"/><circle cx="200" cy="30" r="2"/><circle cx="560" cy="60" r="2"/><circle cx="420" cy="24" r="2"/></g>
  <circle cx="580" cy="50" r="22" fill="#FFF1B5"/>
  <!-- pandal -->
  <rect x="440" y="90" width="160" height="190" fill="#2D3A6B" stroke="#FFB703" stroke-width="4"/>
  <circle cx="520" cy="150" r="40" fill="none" stroke="#FFB703" stroke-width="6"/>
  <g fill="#F72585"><circle cx="460" cy="110" r="6"/><circle cx="580" cy="110" r="6"/><circle cx="460" cy="260" r="6"/><circle cx="580" cy="260" r="6"/></g>
  <circle cx="520" cy="150" r="14" fill="#FFD43B"/>
  <!-- lanterns -->
  <path d="M0 70 Q220 110 430 70" fill="none" stroke="#AAA" stroke-width="2"/>
  <g><polygon points="80,84 100,104 80,124 60,104" fill="#FFB703"/><polygon points="190,94 210,114 190,134 170,114" fill="#E8453C"/><polygon points="300,92 320,112 300,132 280,112" fill="#2EC4B6"/><polygon points="400,78 420,98 400,118 380,98" fill="#F72585"/></g>
  <!-- stall -->
  <rect x="120" y="190" width="260" height="20" fill="#E8453C"/>
  <rect x="130" y="210" width="240" height="70" fill="#F2D49B"/>
  <text x="182" y="206" font-family="sans-serif" font-size="15" fill="#FFF">DANSALA · FREE</text>
  <g fill="#FFF"><ellipse cx="180" cy="232" rx="26" ry="10"/><ellipse cx="250" cy="232" rx="26" ry="10"/></g>
  <g fill="#C8A06A"><ellipse cx="180" cy="228" rx="20" ry="6"/><ellipse cx="250" cy="228" rx="20" ry="6"/></g>
  <!-- volunteers -->
  <circle cx="310" cy="160" r="16" fill="#C68642"/><rect x="296" y="176" width="28" height="34" fill="#FFF"/>
  <circle cx="210" cy="160" r="16" fill="#8D5524"/><rect x="196" y="176" width="28" height="34" fill="#FFF"/>
  <!-- queue -->
  <g>
    <circle cx="70" cy="250" r="15" fill="#B9773E"/><rect x="56" y="265" width="28" height="60" fill="#3A86FF"/>
    <circle cx="30" cy="258" r="13" fill="#8D5524"/><rect x="18" y="271" width="24" height="54" fill="#7C6CF0"/>
  </g>
  <rect y="320" width="640" height="80" fill="#3B3B3B"/>
  <!-- child carrying cups -->
  <circle cx="400" cy="290" r="13" fill="#C68642"/><rect x="389" y="303" width="22" height="34" fill="#2EC4B6"/>
  <g fill="#FFF"><rect x="414" y="300" width="9" height="12"/><rect x="425" y="300" width="9" height="12"/></g>
</svg>
