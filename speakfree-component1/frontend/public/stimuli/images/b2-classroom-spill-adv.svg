<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">An art class: a boy has knocked over a pot of blue paint, a girl runs for a cloth, the teacher comes over and a cat walks through the paint</title>
  <rect width="640" height="400" fill="#F4F1E8"/>
  <rect y="300" width="640" height="100" fill="#D9C7A7"/>
  <!-- blackboard + window -->
  <rect x="40" y="40" width="240" height="120" fill="#2F5233" stroke="#8B5A2B" stroke-width="8"/>
  <text x="70" y="95" font-family="sans-serif" font-size="22" fill="#FFF">ART CLASS</text>
  <text x="70" y="128" font-family="sans-serif" font-size="16" fill="#FFF">Paint a flower</text>
  <rect x="440" y="40" width="160" height="110" fill="#BDE6FF" stroke="#FFF" stroke-width="8"/><line x1="520" y1="40" x2="520" y2="150" stroke="#FFF" stroke-width="6"/>
  <!-- desk + spill -->
  <rect x="150" y="230" width="220" height="14" fill="#B07D4F"/><rect x="165" y="244" width="10" height="60" fill="#B07D4F"/><rect x="345" y="244" width="10" height="60" fill="#B07D4F"/>
  <rect x="250" y="210" width="60" height="20" fill="#FFF" stroke="#999"/>
  <path d="M330 230 l18 -16 l14 10 l-12 18z" fill="#DDD" stroke="#999"/>
  <path d="M352 236 q20 10 14 34 q-4 20 10 40 q40 20 90 6 q30 -8 10 -20 q-30 -12 -60 -2 q-40 4 -52 -20z" fill="#3A86FF" opacity=".9"/>
  <!-- paw prints -->
  <g fill="#3A86FF"><circle cx="500" cy="330" r="5"/><circle cx="525" cy="340" r="5"/><circle cx="548" cy="328" r="5"/></g>
  <!-- cat -->
  <ellipse cx="590" cy="320" rx="30" ry="16" fill="#F4A259"/><circle cx="620" cy="304" r="14" fill="#F4A259"/>
  <polygon points="612,292 616,280 622,292" fill="#F4A259"/><polygon points="624,292 630,280 632,294" fill="#F4A259"/>
  <path d="M560 316 q-20 -20 -6 -34" stroke="#F4A259" stroke-width="6" fill="none"/>
  <!-- boy surprised -->
  <circle cx="260" cy="180" r="22" fill="#8D5524"/><path d="M238 172 q22 -30 44 0 q-4 -22 -22 -24 q-18 2 -22 24z" fill="#1B1B1B"/>
  <circle cx="253" cy="180" r="3" fill="#222"/><circle cx="267" cy="180" r="3" fill="#222"/><ellipse cx="260" cy="192" rx="5" ry="6" fill="#222"/>
  <!-- girl running with cloth -->
  <circle cx="110" cy="200" r="20" fill="#B9773E"/><path d="M90 196 q20 -28 40 0 q0 -22 -20 -24 q-20 2 -20 24z" fill="#2B1B0E"/>
  <path d="M92 222 h36 l12 60 h-60z" fill="#E8453C"/>
  <rect x="134" y="226" width="34" height="22" fill="#FFF" stroke="#AAA"/>
  <line x1="98" y1="282" x2="84" y2="320" stroke="#B9773E" stroke-width="8" stroke-linecap="round"/><line x1="122" y1="282" x2="140" y2="316" stroke="#B9773E" stroke-width="8" stroke-linecap="round"/>
  <!-- teacher -->
  <circle cx="440" cy="190" r="22" fill="#C68642"/><path d="M418 188 q22 -36 44 0 q6 -30 -22 -32 q-28 2 -22 32z" fill="#3B2314"/>
  <path d="M416 214 h48 l14 90 h-76z" fill="#7C6CF0"/>
  <line x1="418" y1="222" x2="388" y2="246" stroke="#C68642" stroke-width="8" stroke-linecap="round"/>
</svg>
