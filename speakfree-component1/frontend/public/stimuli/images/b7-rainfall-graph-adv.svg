<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Chart: monthly rainfall in millimetres as bars and reservoir level in percent as a line, January to August; rainfall peaks in May and June, the reservoir rises after a one-month delay and falls from July</title>
  <rect width="640" height="400" fill="#FFF"/>
  <text x="40" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1B2559">Rainfall and reservoir level, Jan–Aug</text>
  <g stroke="#E6E8F2"><line x1="60" y1="320" x2="600" y2="320"/><line x1="60" y1="260" x2="600" y2="260"/><line x1="60" y1="200" x2="600" y2="200"/><line x1="60" y1="140" x2="600" y2="140"/><line x1="60" y1="80" x2="600" y2="80"/></g>
  <g font-family="sans-serif" font-size="11" fill="#7A8299"><text x="30" y="324">0</text><text x="24" y="264">100</text><text x="24" y="204">200</text><text x="24" y="144">300</text><text x="24" y="84">400</text>
    <text x="606" y="324">0%</text><text x="606" y="204">50%</text><text x="606" y="84">100%</text></g>
  <!-- bars: rainfall mm -->
  <g fill="#7C6CF0">
    <rect x="78" y="290" width="40" height="30"/><rect x="146" y="296" width="40" height="24"/><rect x="214" y="266" width="40" height="54"/><rect x="282" y="200" width="40" height="120"/>
    <rect x="350" y="104" width="40" height="216"/><rect x="418" y="128" width="40" height="192"/><rect x="486" y="242" width="40" height="78"/><rect x="554" y="272" width="40" height="48"/>
  </g>
  <!-- line: reservoir % -->
  <polyline points="98,236 166,248 234,254 302,236 370,176 438,116 506,104 574,152" fill="none" stroke="#0E9F8E" stroke-width="3"/>
  <g fill="#0E9F8E" stroke="#FFF" stroke-width="2"><circle cx="98" cy="236" r="5"/><circle cx="166" cy="248" r="5"/><circle cx="234" cy="254" r="5"/><circle cx="302" cy="236" r="5"/><circle cx="370" cy="176" r="5"/><circle cx="438" cy="116" r="5"/><circle cx="506" cy="104" r="5"/><circle cx="574" cy="152" r="5"/></g>
  <g font-family="sans-serif" font-size="12" fill="#1B2559"><text x="88" y="340">Jan</text><text x="155" y="340">Feb</text><text x="222" y="340">Mar</text><text x="292" y="340">Apr</text><text x="358" y="340">May</text><text x="427" y="340">Jun</text><text x="497" y="340">Jul</text><text x="562" y="340">Aug</text></g>
  <g font-family="sans-serif" font-size="12" fill="#1B2559"><rect x="60" y="360" width="14" height="10" fill="#7C6CF0"/><text x="80" y="369">Rainfall (mm, left)</text>
    <line x1="230" y1="365" x2="250" y2="365" stroke="#0E9F8E" stroke-width="3"/><text x="256" y="369">Reservoir level (%, right)</text></g>
</svg>
