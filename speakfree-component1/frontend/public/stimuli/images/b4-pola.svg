<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">A weekly street market (pola) with vegetable and fruit stalls, a vendor weighing beans, shoppers and a parked tuk-tuk</title>
  <rect width="640" height="400" fill="#FFF8E1"/>
  <rect y="290" width="640" height="110" fill="#BDBDBD"/>
  <g stroke="#fff" stroke-width="4" stroke-dasharray="26 18"><line x1="0" y1="350" x2="640" y2="350"/></g>
  <!-- palm tree -->
  <rect x="598" y="120" width="12" height="170" fill="#8D6E63" transform="rotate(4 604 200)"/>
  <g fill="#43A047"><path d="M604 120 q-50 -10 -70 20 q40 -14 70 -20z"/><path d="M604 120 q50 -16 30 34 q-6 -26 -30 -34z"/><path d="M604 120 q-10 -44 26 -50 q-24 22 -26 50z"/></g>
  <!-- stall 1: vegetables -->
  <polygon points="20,120 220,120 240,160 0,160" fill="#E53935"/>
  <g fill="#fff"><polygon points="40,120 70,120 66,160 30,160"/><polygon points="110,120 140,120 144,160 106,160"/><polygon points="180,120 210,120 224,160 184,160"/></g>
  <line x1="20" y1="160" x2="20" y2="290" stroke="#6D4C41" stroke-width="6"/><line x1="220" y1="160" x2="220" y2="290" stroke="#6D4C41" stroke-width="6"/>
  <rect x="10" y="220" width="220" height="20" fill="#8D6E63"/>
  <g fill="#FB8C00"><polygon points="30,220 40,190 50,220"/><polygon points="48,220 58,192 68,220"/><polygon points="66,220 76,190 86,220"/></g>
  <g fill="#E53935"><circle cx="110" cy="210" r="10"/><circle cx="130" cy="210" r="10"/><circle cx="120" cy="196" r="10"/></g>
  <g fill="#7CB342"><ellipse cx="175" cy="208" rx="22" ry="12"/><ellipse cx="200" cy="206" rx="14" ry="12"/></g>
  <!-- scale -->
  <rect x="150" y="232" width="34" height="8" fill="#455A64"/>
  <!-- vendor -->
  <g><circle cx="110" cy="252" r="14" fill="#8D5524"/><rect x="94" y="266" width="32" height="24" rx="6" fill="#1E88E5"/></g>
  <!-- stall 2: fruit -->
  <polygon points="250,120 450,120 470,160 230,160" fill="#43A047"/>
  <g fill="#FFEB3B"><polygon points="270,120 300,120 296,160 262,160"/><polygon points="340,120 370,120 372,160 336,160"/><polygon points="410,120 440,120 452,160 414,160"/></g>
  <line x1="250" y1="160" x2="250" y2="290" stroke="#6D4C41" stroke-width="6"/><line x1="450" y1="160" x2="450" y2="290" stroke="#6D4C41" stroke-width="6"/>
  <rect x="240" y="220" width="220" height="20" fill="#8D6E63"/>
  <g fill="#FDD835" stroke="#C6A700"><path d="M262 214 q20 14 40 0 q-20 8 -40 0z"/><path d="M266 204 q20 14 40 0 q-20 8 -40 0z"/></g>
  <g fill="#FF7043"><circle cx="340" cy="208" r="11"/><circle cx="364" cy="208" r="11"/></g>
  <g fill="#6D4C41"><circle cx="410" cy="206" r="13"/><circle cx="434" cy="208" r="12"/></g>
  <!-- shoppers -->
  <g><circle cx="300" cy="248" r="14" fill="#C68642"/><path d="M286 262 h28 l6 40 h-40z" fill="#AB47BC"/><rect x="318" y="270" width="18" height="20" rx="3" fill="#FFCA28"/></g>
  <g><circle cx="200" cy="300" r="14" fill="#A0522D"/><rect x="186" y="314" width="28" height="34" rx="6" fill="#00897B"/></g>
  <!-- tuk-tuk -->
  <g>
    <path d="M480 250 q0 -50 50 -54 h50 v100 h-100z" fill="#2E7D32"/>
    <rect x="500" y="212" width="40" height="34" rx="4" fill="#B3E5FC"/>
    <rect x="550" y="212" width="26" height="40" fill="#1B5E20"/>
    <rect x="472" y="292" width="116" height="10" fill="#1B5E20"/>
    <circle cx="492" cy="308" r="15" fill="#212121"/><circle cx="492" cy="308" r="6" fill="#9E9E9E"/>
    <circle cx="570" cy="308" r="15" fill="#212121"/><circle cx="570" cy="308" r="6" fill="#9E9E9E"/>
  </g>
</svg>
