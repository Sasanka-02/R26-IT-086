<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">A busy school playground: a slide, a swing, children playing ball and a teacher with a whistle</title>
  <defs>
    <g id="kid"><circle cx="0" cy="-34" r="13" fill="#A8693A"/><rect x="-12" y="-21" width="24" height="30" rx="6"/><line x1="-6" y1="9" x2="-8" y2="30" stroke="#A8693A" stroke-width="6" stroke-linecap="round"/><line x1="6" y1="9" x2="8" y2="30" stroke="#A8693A" stroke-width="6" stroke-linecap="round"/></g>
  </defs>
  <rect width="640" height="400" fill="#CFEFFF"/>
  <rect y="280" width="640" height="120" fill="#8ED16B"/>
  <rect x="380" y="300" width="160" height="60" rx="10" fill="#F2D49B"/>
  <!-- school building -->
  <rect x="20" y="150" width="170" height="130" fill="#F6E7C8" stroke="#C9A36A" stroke-width="3"/>
  <polygon points="10,150 105,100 200,150" fill="#C0392B"/>
  <g fill="#7FB3D5"><rect x="40" y="180" width="30" height="26"/><rect x="90" y="180" width="30" height="26"/><rect x="140" y="180" width="30" height="26"/></g>
  <rect x="92" y="226" width="26" height="54" fill="#8B5A2B"/>
  <!-- slide -->
  <g stroke="#555" stroke-width="5"><line x1="230" y1="300" x2="230" y2="190"/><line x1="260" y1="300" x2="260" y2="190"/></g>
  <g stroke="#555" stroke-width="3"><line x1="230" y1="220" x2="260" y2="220"/><line x1="230" y1="250" x2="260" y2="250"/><line x1="230" y1="280" x2="260" y2="280"/></g>
  <path d="M260 190 L340 300 L352 300 L268 184Z" fill="#F4A261"/>
  <use href="#kid" x="300" y="230" fill="#4361EE"/>
  <!-- swing -->
  <g stroke="#6D4C41" stroke-width="6"><line x1="430" y1="150" x2="410" y2="290"/><line x1="530" y1="150" x2="550" y2="290"/><line x1="425" y1="150" x2="535" y2="150"/></g>
  <g stroke="#555" stroke-width="2"><line x1="465" y1="150" x2="470" y2="240"/><line x1="495" y1="150" x2="500" y2="240"/></g>
  <rect x="462" y="238" width="44" height="7" fill="#6D4C41"/>
  <use href="#kid" x="485" y="232" fill="#E63946"/>
  <!-- ball game -->
  <use href="#kid" x="120" y="350" fill="#2A9D8F"/>
  <use href="#kid" x="230" y="356" fill="#F72585"/>
  <circle cx="176" cy="318" r="11" fill="#FFD60A" stroke="#C99700" stroke-width="2"/>
  <!-- sandpit child -->
  <use href="#kid" x="440" y="340" fill="#9B5DE5"/>
  <rect x="470" y="330" width="18" height="14" fill="#E76F51"/>
  <!-- teacher -->
  <g><circle cx="600" cy="262" r="15" fill="#8D5524"/><rect x="584" y="277" width="32" height="50" rx="6" fill="#264653"/>
    <line x1="592" y1="327" x2="590" y2="360" stroke="#8D5524" stroke-width="7" stroke-linecap="round"/><line x1="608" y1="327" x2="610" y2="360" stroke="#8D5524" stroke-width="7" stroke-linecap="round"/>
    <circle cx="600" cy="282" r="4" fill="#C0C0C0"/></g>
</svg>
