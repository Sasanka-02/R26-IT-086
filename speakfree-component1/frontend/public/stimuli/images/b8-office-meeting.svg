<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">An office meeting: a presenter points at a project plan on a screen, colleagues sit around a table, one checks a phone and one takes notes</title>
  <rect width="640" height="400" fill="#EEF1F7"/>
  <!-- window with city -->
  <rect x="460" y="40" width="160" height="150" fill="#BBDEFB" stroke="#90A4AE" stroke-width="5"/>
  <g fill="#90A4AE"><rect x="472" y="110" width="26" height="80"/><rect x="504" y="90" width="30" height="100"/><rect x="540" y="120" width="22" height="70"/><rect x="568" y="100" width="40" height="90"/></g>
  <!-- clock -->
  <circle cx="400" cy="60" r="20" fill="#fff" stroke="#455A64" stroke-width="3"/><line x1="400" y1="60" x2="400" y2="47" stroke="#455A64" stroke-width="3"/><line x1="400" y1="60" x2="410" y2="64" stroke="#455A64" stroke-width="3"/>
  <!-- screen -->
  <rect x="40" y="40" width="230" height="140" rx="6" fill="#1B2559"/>
  <rect x="50" y="50" width="210" height="120" fill="#FFFFFF"/>
  <text x="155" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1B2559">Q3 Project Plan</text>
  <g fill="#1D4ED8"><rect x="70" y="120" width="22" height="40"/><rect x="104" y="104" width="22" height="56"/><rect x="138" y="94" width="22" height="66"/></g>
  <g fill="#16A34A"><rect x="180" y="96" width="70" height="8" rx="3"/><rect x="180" y="114" width="56" height="8" rx="3"/></g>
  <rect x="180" y="132" width="46" height="8" rx="3" fill="#DC2626"/>
  <!-- presenter -->
  <g><circle cx="320" cy="140" r="17" fill="#8D5524"/><rect x="302" y="157" width="36" height="66" rx="8" fill="#37474F"/>
    <line x1="304" y1="170" x2="262" y2="130" stroke="#8D5524" stroke-width="7" stroke-linecap="round"/>
    <line x1="312" y1="223" x2="310" y2="270" stroke="#263238" stroke-width="9"/><line x1="328" y1="223" x2="332" y2="270" stroke="#263238" stroke-width="9"/></g>
  <!-- table -->
  <ellipse cx="380" cy="320" rx="240" ry="58" fill="#8D6E63"/>
  <ellipse cx="380" cy="312" rx="240" ry="58" fill="#A1887F"/>
  <!-- people around the table -->
  <g><circle cx="200" cy="252" r="16" fill="#C68642"/><rect x="184" y="268" width="32" height="40" rx="8" fill="#AB47BC"/></g>
  <rect x="210" y="292" width="34" height="22" rx="2" fill="#ECEFF1" transform="rotate(-8 227 303)"/>
  <line x1="214" y1="296" x2="238" y2="292" stroke="#90A4AE" stroke-width="2"/>
  <g><circle cx="300" cy="262" r="16" fill="#A0522D"/><rect x="284" y="278" width="32" height="36" rx="8" fill="#1E88E5"/></g>
  <g><circle cx="430" cy="262" r="16" fill="#8D5524"/><rect x="414" y="278" width="32" height="36" rx="8" fill="#43A047"/>
    <rect x="440" y="252" width="10" height="18" rx="2" fill="#212121"/><line x1="444" y1="278" x2="446" y2="268" stroke="#8D5524" stroke-width="6" stroke-linecap="round"/></g>
  <g><circle cx="540" cy="256" r="16" fill="#C68642"/><rect x="524" y="272" width="32" height="40" rx="8" fill="#F4511E"/></g>
  <rect x="356" y="296" width="44" height="26" rx="3" fill="#455A64"/><rect x="360" y="290" width="36" height="8" fill="#90A4AE"/>
  <g fill="#FFFFFF" stroke="#795548" stroke-width="2"><rect x="262" y="318" width="12" height="14" rx="2"/><rect x="480" y="312" width="12" height="14" rx="2"/></g>
</svg>
