<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Cooking Together</title>
  <desc id="d">A family cooks in a kitchen: a mother stirs soup on the stove, a father chops carrots, a child mixes batter on a stool, and a cat watches from the floor.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#d7f0fb"/>
    </linearGradient>
  </defs>

  <!-- wall + floor -->
  <rect width="800" height="600" fill="#fbefd9"/>
  <rect y="470" width="800" height="130" fill="#d9b48a"/>
  <g stroke="#c49b6e" stroke-width="2">
    <line x1="0" y1="510" x2="800" y2="510"/>
    <line x1="0" y1="555" x2="800" y2="555"/>
    <line x1="120" y1="470" x2="100" y2="600"/>
    <line x1="300" y1="470" x2="290" y2="600"/>
    <line x1="500" y1="470" x2="510" y2="600"/>
    <line x1="680" y1="470" x2="700" y2="600"/>
  </g>

  <!-- window -->
  <rect x="300" y="50" width="200" height="150" rx="6" fill="url(#sky)" stroke="#ffffff" stroke-width="10"/>
  <line x1="400" y1="50" x2="400" y2="200" stroke="#ffffff" stroke-width="8"/>
  <line x1="300" y1="125" x2="500" y2="125" stroke="#ffffff" stroke-width="8"/>
  <circle cx="455" cy="88" r="20" fill="#ffd45c"/>
  <ellipse cx="345" cy="160" rx="35" ry="14" fill="#7cc576"/>
  <ellipse cx="455" cy="168" rx="40" ry="14" fill="#68b863"/>
  <rect x="290" y="198" width="220" height="12" rx="4" fill="#ffffff"/>
  <!-- plant on sill -->
  <rect x="460" y="176" width="26" height="24" rx="4" fill="#d9734e"/>
  <path d="M473 178 q-18 -26 -8 -40 M473 178 q2 -30 14 -38 M473 178 q-4 -22 -22 -24" stroke="#3f9a52" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- clock -->
  <circle cx="640" cy="90" r="38" fill="#ffffff" stroke="#e07a5f" stroke-width="7"/>
  <line x1="640" y1="90" x2="640" y2="66" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="640" y1="90" x2="658" y2="98" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- upper cabinets -->
  <rect x="30" y="40" width="220" height="120" rx="6" fill="#7fb7a4" stroke="#5c9686" stroke-width="4"/>
  <line x1="140" y1="40" x2="140" y2="160" stroke="#5c9686" stroke-width="4"/>
  <rect x="124" y="120" width="6" height="24" rx="3" fill="#5c9686"/><rect x="150" y="120" width="6" height="24" rx="3" fill="#5c9686"/>

  <!-- counter + stove -->
  <rect x="20" y="300" width="300" height="170" fill="#7fb7a4" stroke="#5c9686" stroke-width="4"/>
  <rect x="10" y="288" width="320" height="18" rx="4" fill="#e9e3d5"/>
  <rect x="40" y="330" width="120" height="110" rx="6" fill="#4b5563"/>
  <rect x="55" y="350" width="90" height="60" rx="4" fill="#1f2937"/>
  <line x1="180" y1="330" x2="180" y2="460" stroke="#5c9686" stroke-width="4"/>
  <circle cx="255" cy="395" r="5" fill="#f5f9f7"/>
  <!-- pot with steam -->
  <rect x="70" y="236" width="100" height="56" rx="10" fill="#c0392b"/>
  <rect x="62" y="232" width="116" height="12" rx="5" fill="#a93226"/>
  <path d="M95 220 q-12 -18 0 -36 q12 -18 0 -36 M120 220 q-12 -18 0 -36 q12 -18 0 -36 M145 220 q-12 -18 0 -36 q12 -18 0 -36" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- MOTHER stirring (left) -->
  <g>
    <rect x="185" y="318" width="34" height="140" rx="10" fill="#33415c"/>
    <rect x="223" y="318" width="34" height="140" rx="10" fill="#33415c"/>
    <ellipse cx="200" cy="462" rx="22" ry="10" fill="#3b2f2f"/>
    <ellipse cx="242" cy="462" rx="22" ry="10" fill="#3b2f2f"/>
    <path d="M180 210 q41 -24 82 0 l10 120 h-102 z" fill="#e76f51"/>
    <path d="M196 250 h50 l8 85 h-66 z" fill="#ffffff" opacity="0.9"/>
    <path d="M186 228 q-40 20 -62 8" stroke="#f1c27d" stroke-width="18" fill="none" stroke-linecap="round"/>
    <line x1="126" y1="236" x2="118" y2="196" stroke="#8d5524" stroke-width="7" stroke-linecap="round"/>
    <path d="M258 228 q24 40 6 76" stroke="#f1c27d" stroke-width="18" fill="none" stroke-linecap="round"/>
    <rect x="212" y="186" width="18" height="22" fill="#f1c27d"/>
    <circle cx="221" cy="160" r="34" fill="#f1c27d"/>
    <path d="M187 160 q-4 -46 34 -48 q40 0 36 48 q-6 -26 -36 -26 q-28 0 -34 26z" fill="#4a2c1d"/>
    <circle cx="252" cy="122" r="16" fill="#4a2c1d"/>
    <circle cx="210" cy="162" r="4" fill="#222"/><circle cx="234" cy="162" r="4" fill="#222"/>
    <path d="M211 178 q10 9 20 0" stroke="#a0522d" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- TABLE -->
  <rect x="360" y="330" width="400" height="22" rx="6" fill="#a0673d"/>
  <rect x="380" y="352" width="18" height="118" fill="#8a5631"/>
  <rect x="722" y="352" width="18" height="118" fill="#8a5631"/>
  <!-- bread -->
  <ellipse cx="420" cy="318" rx="44" ry="18" fill="#d4943f"/>
  <path d="M396 312 l10 -8 M416 310 l10 -8 M436 312 l10 -8" stroke="#b4772d" stroke-width="4" stroke-linecap="round"/>
  <!-- cutting board with carrots -->
  <rect x="560" y="316" width="120" height="16" rx="5" fill="#deb887"/>
  <path d="M575 316 l40 -10 l-38 2 z" fill="#f08a24"/>
  <circle cx="630" cy="314" r="5" fill="#f08a24"/><circle cx="645" cy="314" r="5" fill="#f08a24"/><circle cx="660" cy="314" r="5" fill="#f08a24"/>
  <!-- fruit bowl -->
  <path d="M688 318 q30 22 60 0 z" fill="#4f9fd6"/>
  <circle cx="702" cy="310" r="10" fill="#e63946"/><circle cx="720" cy="306" r="11" fill="#f4a261"/><circle cx="737" cy="311" r="9" fill="#9bc53d"/>

  <!-- CHILD on stool mixing -->
  <g>
    <rect x="455" y="400" width="80" height="14" rx="5" fill="#e9c46a"/>
    <rect x="462" y="414" width="10" height="56" fill="#c9a24a"/>
    <rect x="518" y="414" width="10" height="56" fill="#c9a24a"/>
    <rect x="470" y="352" width="22" height="52" rx="8" fill="#2a9d8f"/>
    <rect x="498" y="352" width="22" height="52" rx="8" fill="#2a9d8f"/>
    <path d="M462 262 q33 -18 66 0 l6 96 h-78 z" fill="#ffd166"/>
    <path d="M466 284 q-6 30 22 40" stroke="#c68642" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M524 284 q6 30 -22 40" stroke="#c68642" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- mixing bowl -->
    <path d="M466 316 q29 34 58 0 z" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/>
    <ellipse cx="495" cy="316" rx="29" ry="6" fill="#f3e3b3"/>
    <line x1="500" y1="318" x2="520" y2="288" stroke="#8d5524" stroke-width="5" stroke-linecap="round"/>
    <rect x="488" y="238" width="14" height="18" fill="#c68642"/>
    <circle cx="495" cy="216" r="28" fill="#c68642"/>
    <path d="M467 212 q0 -38 28 -38 q30 0 28 38 q-6 -18 -28 -20 q-22 2 -28 20z" fill="#1d1d1d"/>
    <circle cx="486" cy="218" r="3.5" fill="#222"/><circle cx="505" cy="218" r="3.5" fill="#222"/>
    <path d="M486 230 q9 9 18 0" stroke="#7a3e1d" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- FATHER chopping (right) -->
  <g>
    <rect x="640" y="352" width="30" height="110" rx="10" fill="#495057"/>
    <rect x="676" y="352" width="30" height="110" rx="10" fill="#495057"/>
    <ellipse cx="652" cy="466" rx="20" ry="9" fill="#222"/>
    <ellipse cx="694" cy="466" rx="20" ry="9" fill="#222"/>
    <path d="M630 196 q43 -22 86 0 l8 156 h-102 z" fill="#4c8bf5"/>
    <path d="M636 222 q-30 50 -2 86" stroke="#8d5524" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M708 222 q-10 60 -60 86" stroke="#8d5524" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- knife -->
    <line x1="640" y1="306" x2="606" y2="314" stroke="#c0c0c0" stroke-width="6" stroke-linecap="round"/>
    <rect x="636" y="300" width="18" height="10" rx="3" fill="#333"/>
    <rect x="664" y="170" width="18" height="24" fill="#8d5524"/>
    <circle cx="673" cy="142" r="34" fill="#8d5524"/>
    <path d="M639 138 q2 -40 34 -40 q34 0 34 40 q-8 -20 -34 -22 q-26 2 -34 22z" fill="#1d1d1d"/>
    <path d="M650 160 q23 26 46 0 q-4 22 -23 22 q-19 0 -23 -22z" fill="#1d1d1d"/>
    <circle cx="662" cy="144" r="4" fill="#111"/><circle cx="686" cy="144" r="4" fill="#111"/>
  </g>

  <!-- CAT -->
  <g>
    <ellipse cx="360" cy="520" rx="46" ry="26" fill="#f4a259"/>
    <circle cx="318" cy="498" r="24" fill="#f4a259"/>
    <path d="M300 484 l4 -22 l14 14 z M322 476 l12 -18 l6 20 z" fill="#f4a259"/>
    <circle cx="310" cy="496" r="3.5" fill="#222"/><circle cx="326" cy="496" r="3.5" fill="#222"/>
    <path d="M312 507 q6 5 12 0" stroke="#222" stroke-width="2" fill="none"/>
    <path d="M404 516 q36 -10 26 -44" stroke="#f4a259" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M346 504 l14 6 M372 500 l10 8" stroke="#d9823b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
