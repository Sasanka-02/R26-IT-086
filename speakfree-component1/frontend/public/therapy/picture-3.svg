<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">At the Beach</title>
  <desc id="d">A sunny beach: two children build a sandcastle, a girl flies a kite, a man reads under an umbrella, a sailboat is on the sea and seagulls fly overhead.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6f1"/>
      <stop offset="1" stop-color="#cdeefc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fc9"/>
      <stop offset="1" stop-color="#4cc0d9"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="300" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="46" fill="#ffd45c"/>
  <g fill="#ffffff">
    <ellipse cx="160" cy="80" rx="60" ry="22"/><ellipse cx="200" cy="66" rx="40" ry="22"/>
    <ellipse cx="470" cy="60" rx="50" ry="18"/><ellipse cx="500" cy="50" rx="30" ry="18"/>
  </g>
  <!-- seagulls -->
  <g stroke="#3a3a3a" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M300 120 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M360 150 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M560 130 q10 -10 20 0 q10 -10 20 0"/>
  </g>

  <!-- sea -->
  <rect y="250" width="800" height="140" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M40 290 q20 -10 40 0 q20 10 40 0"/>
    <path d="M300 320 q20 -10 40 0 q20 10 40 0"/>
    <path d="M620 300 q20 -10 40 0 q20 10 40 0"/>
  </g>
  <!-- sailboat -->
  <g>
    <path d="M520 270 h110 l-18 22 h-74 z" fill="#8a4b2a"/>
    <line x1="575" y1="270" x2="575" y2="168" stroke="#5b3a29" stroke-width="5"/>
    <path d="M579 172 l46 92 h-46 z" fill="#ffffff"/>
    <path d="M571 180 l-40 84 h40 z" fill="#ef476f"/>
  </g>
  <!-- foam line -->
  <path d="M0 390 q50 -16 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 v14 h-800 z" fill="#ffffff" opacity="0.85"/>

  <!-- sand -->
  <rect y="398" width="800" height="202" fill="#f3d9a4"/>
  <g fill="#e2c385">
    <circle cx="90" cy="560" r="4"/><circle cx="260" cy="520" r="3"/><circle cx="420" cy="580" r="4"/>
    <circle cx="610" cy="560" r="3"/><circle cx="740" cy="520" r="4"/>
  </g>

  <!-- KITE + GIRL (left) -->
  <g>
    <path d="M120 150 l36 -40 l36 40 l-36 50 z" fill="#ff8c42"/>
    <path d="M120 150 h72 M156 110 v90" stroke="#c75b12" stroke-width="3"/>
    <path d="M156 200 q-10 30 4 50 q14 20 0 40" stroke="#ef476f" stroke-width="4" fill="none"/>
    <line x1="156" y1="200" x2="112" y2="395" stroke="#444" stroke-width="2"/>
    <rect x="90" y="468" width="16" height="70" rx="7" fill="#c68642"/>
    <rect x="112" y="468" width="16" height="70" rx="7" fill="#c68642"/>
    <path d="M84 404 q25 -12 50 0 l12 70 h-74 z" fill="#06d6a0"/>
    <path d="M128 412 q-6 -18 -16 -20" stroke="#c68642" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M88 414 q-16 30 -8 50" stroke="#c68642" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="109" cy="376" r="24" fill="#c68642"/>
    <path d="M85 376 q-2 -34 24 -34 q28 0 26 34 q-4 -16 -26 -18 q-20 2 -24 18z" fill="#2b1a10"/>
    <path d="M133 372 q14 20 4 44" stroke="#2b1a10" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="101" cy="378" r="3" fill="#111"/><circle cx="117" cy="378" r="3" fill="#111"/>
    <path d="M102 388 q7 6 14 0" stroke="#7a3e1d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

