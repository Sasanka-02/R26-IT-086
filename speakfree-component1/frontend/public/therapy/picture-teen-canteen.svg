<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">The School Canteen at Interval</title>
  <desc id="d">Students in white school uniforms at the canteen during interval: two queue at the counter where the canteen aunty serves buns and tea, three sit at a table — one laughing, one reading, one drinking from a bottle — a boy has spilled his drink on the floor, a notice board announces the sports meet, and the clock shows half past ten.</desc>

  <!-- wall + floor -->
  <rect width="800" height="600" fill="#fdf3dc"/>
  <rect y="430" width="800" height="170" fill="#cfd8dc"/>
  <g stroke="#b0bec5" stroke-width="2">
    <line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="100" y1="430" x2="70" y2="600"/><line x1="260" y1="430" x2="245" y2="600"/>
    <line x1="420" y1="430" x2="420" y2="600"/><line x1="580" y1="430" x2="595" y2="600"/>
    <line x1="740" y1="430" x2="770" y2="600"/>
  </g>

  <!-- clock: half past ten -->
  <circle cx="400" cy="70" r="38" fill="#ffffff" stroke="#455a64" stroke-width="6"/>
  <line x1="400" y1="70" x2="384" y2="58" stroke="#263238" stroke-width="6" stroke-linecap="round"/>
  <line x1="400" y1="70" x2="400" y2="100" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="70" r="4" fill="#263238"/>

  <!-- notice board -->
  <rect x="560" y="40" width="200" height="130" rx="6" fill="#a1887f"/>
  <rect x="572" y="52" width="176" height="106" fill="#f5e6c8"/>
  <text x="660" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#c62828">SPORTS MEET</text>
  <text x="660" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#37474f">Friday · 8.00 a.m.</text>
  <text x="660" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#37474f">All houses — be there!</text>
  <circle cx="580" cy="60" r="5" fill="#e53935"/><circle cx="740" cy="60" r="5" fill="#1e88e5"/>

  <!-- counter + price board -->
  <rect x="20" y="40" width="250" height="70" rx="6" fill="#37474f"/>
  <text x="145" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">CANTEEN</text>
  <text x="145" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ffe082">Fish bun Rs. 80 · Tea Rs. 50</text>
  <rect x="20" y="250" width="290" height="190" fill="#8d6e63"/>
  <rect x="20" y="240" width="290" height="18" fill="#6d4c41"/>
  <!-- canteen aunty behind the counter -->
  <circle cx="110" cy="165" r="26" fill="#a86b45"/>
  <path d="M84 158 q26 -34 52 0 q-4 -22 -26 -24 q-22 2 -26 24z" fill="#2b1b12"/>
  <rect x="80" y="190" width="60" height="55" rx="14" fill="#7e57c2"/>
  <rect x="92" y="196" width="36" height="46" fill="#ffffff"/>
  <!-- buns, tea -->
  <ellipse cx="180" cy="234" rx="20" ry="11" fill="#e0a64f"/>
  <ellipse cx="215" cy="234" rx="20" ry="11" fill="#d39740"/>
  <ellipse cx="250" cy="234" rx="20" ry="11" fill="#e0a64f"/>
  <rect x="140" y="218" width="18" height="22" rx="3" fill="#ffffff" stroke="#bcaaa4" stroke-width="2"/>
  <path d="M158 224 q8 4 0 10" fill="none" stroke="#bcaaa4" stroke-width="3"/>

  <!-- queue: two students -->
  <g>
    <circle cx="340" cy="250" r="24" fill="#8d5a3b"/>
    <path d="M316 246 q24 -30 48 0 q-6 -20 -24 -20 q-18 0 -24 20z" fill="#1b1b1b"/>
    <rect x="314" y="274" width="52" height="90" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
    <polygon points="340,278 334,300 340,322 346,300" fill="#1565c0"/>
    <rect x="318" y="362" width="18" height="70" fill="#455a64"/><rect x="344" y="362" width="18" height="70" fill="#455a64"/>
    <rect x="364" y="300" width="14" height="40" rx="7" fill="#8d5a3b"/>
  </g>
  <g>
    <circle cx="410" cy="246" r="24" fill="#c68e5f"/>
    <path d="M386 248 q2 -36 24 -36 q22 0 24 36 q-4 34 -6 70 l-36 0 q-2 -36 -6 -70z" fill="#2b1b12"/>
    <circle cx="410" cy="246" r="22" fill="#c68e5f"/>
    <rect x="384" y="270" width="52" height="60" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
    <rect x="384" y="326" width="52" height="46" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
    <rect x="390" y="370" width="16" height="62" fill="#c68e5f"/><rect x="414" y="370" width="16" height="62" fill="#c68e5f"/>
    <rect x="388" y="428" width="20" height="8" rx="3" fill="#212121"/><rect x="412" y="428" width="20" height="8" rx="3" fill="#212121"/>
  </g>

  <!-- table with three students -->
  <rect x="470" y="330" width="300" height="20" rx="6" fill="#ff8a65"/>
  <rect x="490" y="350" width="12" height="80" fill="#bf5f3f"/><rect x="738" y="350" width="12" height="80" fill="#bf5f3f"/>
  <!-- laughing student -->
  <circle cx="515" cy="268" r="24" fill="#a86b45"/>
  <path d="M491 262 q24 -30 48 0 q-6 -20 -24 -20 q-18 0 -24 20z" fill="#1b1b1b"/>
  <path d="M503 274 q12 14 24 0z" fill="#5d2e1a"/>
  <rect x="490" y="292" width="50" height="40" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <!-- reading student with a book -->
  <circle cx="610" cy="264" r="24" fill="#8d5a3b"/>
  <path d="M586 266 q2 -34 24 -34 q22 0 24 34 q-2 20 -4 28 l-40 0 q-2 -8 -4 -28z" fill="#2b1b12"/>
  <circle cx="610" cy="266" r="21" fill="#8d5a3b"/>
  <rect x="585" y="288" width="50" height="44" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <path d="M584 300 l26 8 l26 -8 l0 26 l-26 8 l-26 -8z" fill="#43a047"/>
  <line x1="610" y1="308" x2="610" y2="334" stroke="#2e7d32" stroke-width="2"/>
  <!-- student drinking from a bottle -->
  <circle cx="705" cy="266" r="24" fill="#c68e5f"/>
  <path d="M681 260 q24 -30 48 0 q-6 -20 -24 -20 q-18 0 -24 20z" fill="#3e2723"/>
  <rect x="680" y="290" width="50" height="42" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <rect x="718" y="244" width="12" height="40" rx="4" fill="#4fc3f7" transform="rotate(-35 724 264)"/>
  <!-- lunch boxes -->
  <rect x="500" y="318" width="40" height="14" rx="3" fill="#ef5350"/>
  <rect x="690" y="318" width="40" height="14" rx="3" fill="#ffca28"/>

  <!-- boy who spilled his drink -->
  <circle cx="230" cy="470" r="22" fill="#a86b45"/>
  <path d="M208 466 q22 -28 44 0 q-6 -18 -22 -18 q-16 0 -22 18z" fill="#1b1b1b"/>
  <circle cx="222" cy="470" r="2.5" fill="#1b1b1b"/><circle cx="238" cy="470" r="2.5" fill="#1b1b1b"/>
  <ellipse cx="230" cy="482" rx="5" ry="4" fill="#5d2e1a"/>
  <rect x="206" y="492" width="48" height="56" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <rect x="210" y="546" width="16" height="44" fill="#455a64"/><rect x="234" y="546" width="16" height="44" fill="#455a64"/>
  <ellipse cx="320" cy="560" rx="60" ry="16" fill="#ff9800" opacity="0.75"/>
  <rect x="300" y="532" width="22" height="30" rx="4" fill="#ffffff" stroke="#bcaaa4" stroke-width="2" transform="rotate(80 311 547)"/>
</svg>
