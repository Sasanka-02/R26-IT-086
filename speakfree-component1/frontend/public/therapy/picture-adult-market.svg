  <path d="M270 450 l0 -55 q0 -28 36 -28 l54 0 q28 0 28 28 l0 55z" fill="#2e7d32"/>
  <rect x="288" y="384" width="54" height="32" fill="#b3e5fc"/>
  <circle cx="290" cy="455" r="15" fill="#212121"/><circle cx="375" cy="455" r="15" fill="#212121"/>

  <!-- traffic policeman with whistle -->
  <circle cx="425" cy="300" r="15" fill="#8d5a3b"/>
  <rect x="408" y="282" width="34" height="10" rx="3" fill="#455a64"/>
  <rect x="410" y="314" width="30" height="44" rx="8" fill="#eceff1"/>
  <rect x="436" y="300" width="9" height="34" rx="4" fill="#8d5a3b" transform="rotate(-70 440 317)"/>
  <circle cx="436" cy="303" r="3" fill="#fdd835"/>
  <rect x="412" y="356" width="11" height="36" fill="#455a64"/><rect x="427" y="356" width="11" height="36" fill="#455a64"/>

  <!-- fruit vendor cart -->
  <rect x="20" y="470" width="150" height="40" rx="6" fill="#8d6e63"/>
  <circle cx="45" cy="520" r="12" fill="#4e342e"/><circle cx="145" cy="520" r="12" fill="#4e342e"/>
  <g><ellipse cx="45" cy="458" rx="12" ry="16" fill="#f9a825"/><path d="M40 444 l5 -12 l5 12z" fill="#43a047"/>
     <ellipse cx="75" cy="458" rx="12" ry="16" fill="#f9a825"/><path d="M70 444 l5 -12 l5 12z" fill="#43a047"/></g>
  <ellipse cx="110" cy="462" rx="14" ry="10" fill="#ffb300"/><ellipse cx="140" cy="462" rx="14" ry="10" fill="#fb8c00"/>
  <circle cx="190" cy="470" r="15" fill="#a86b45"/><rect x="176" y="484" width="30" height="40" rx="8" fill="#26a69a"/>

  <!-- man carrying a box on his head -->
  <rect x="220" y="490" width="44" height="30" fill="#bcaaa4" stroke="#8d6e63" stroke-width="2"/>
  <circle cx="242" cy="530" r="13" fill="#8d5a3b"/>
  <rect x="230" y="542" width="26" height="38" rx="7" fill="#5c6bc0"/>
  <rect x="224" y="510" width="7" height="30" rx="3" fill="#8d5a3b"/><rect x="255" y="510" width="7" height="30" rx="3" fill="#8d5a3b"/>

  <!-- woman with umbrella on the phone -->
  <path d="M500 520 q40 -40 80 0z" fill="#ec407a"/><line x1="540" y1="520" x2="540" y2="560" stroke="#424242" stroke-width="3"/>
  <circle cx="555" cy="540" r="13" fill="#c68e5f"/>
  <rect x="560" y="532" width="6" height="12" rx="2" fill="#212121"/>
  <rect x="543" y="552" width="26" height="40" rx="7" fill="#7e57c2"/>

  <!-- man running for the bus -->
  <circle cx="710" cy="520" r="13" fill="#a86b45"/>
  <rect x="698" y="532" width="24" height="34" rx="7" fill="#90a4ae"/>
  <rect x="700" y="562" width="9" height="30" fill="#37474f" transform="rotate(30 704 577)"/>
  <rect x="712" y="562" width="9" height="30" fill="#37474f" transform="rotate(-30 716 577)"/>
  <rect x="680" y="540" width="20" height="14" rx="3" fill="#6d4c41"/>
  <path d="M735 515 l20 -8 M735 525 l22 0" stroke="#757575" stroke-width="2"/>

  <!-- dog by the kerb -->
  <ellipse cx="320" cy="560" rx="26" ry="12" fill="#a1887f"/>
  <circle cx="345" cy="548" r="10" fill="#a1887f"/><path d="M350 540 l6 -8 l2 10z" fill="#8d6e63"/>
  <rect x="300" y="566" width="6" height="16" fill="#8d6e63"/><rect x="330" y="566" width="6" height="16" fill="#8d6e63"/>
</svg>
