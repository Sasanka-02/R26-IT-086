<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">A Busy Market Street in Pettah</title>
  <desc id="d">A crowded market street: shops with signs for textiles, a pharmacy and mobile phones, a 50% sale banner, a red bus, a yellow and a green tuk-tuk stuck in traffic, a traffic policeman with a whistle, a fruit vendor's cart of pineapples and mangoes, a man carrying a box on his head, a woman with an umbrella talking on the phone, a man running for the bus, a dog by the kerb, a clock tower showing ten past nine, and a pedestrian crossing.</desc>

  <rect width="800" height="600" fill="#ffe8c2"/>
  <!-- clock tower -->
  <rect x="370" y="10" width="60" height="150" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <polygon points="362,14 400,-20 438,14" fill="#b71c1c"/>
  <circle cx="400" cy="55" r="20" fill="#ffffff" stroke="#424242" stroke-width="4"/>
  <line x1="400" y1="55" x2="400" y2="40" stroke="#212121" stroke-width="3"/>
  <line x1="400" y1="55" x2="412" y2="58" stroke="#212121" stroke-width="4"/>
  <!-- overhead wires -->
  <path d="M0 40 q200 40 400 10 q200 -30 400 20" fill="none" stroke="#424242" stroke-width="2"/>
  <path d="M0 60 q220 30 400 25 q200 -10 400 30" fill="none" stroke="#424242" stroke-width="2"/>

  <!-- shops left -->
  <rect x="0" y="80" width="180" height="240" fill="#ffccbc"/>
  <rect x="10" y="90" width="160" height="34" fill="#6a1b9a"/>
  <text x="90" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">TEXTILES</text>
  <rect x="20" y="140" width="140" height="120" fill="#fff8e1"/>
  <g fill="#e91e63"><rect x="30" y="150" width="24" height="70"/></g><rect x="62" y="150" width="24" height="70" fill="#03a9f4"/>
  <rect x="94" y="150" width="24" height="70" fill="#ffc107"/><rect x="126" y="150" width="24" height="70" fill="#4caf50"/>
  <rect x="0" y="270" width="180" height="40" fill="#d84315"/>
  <text x="90" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">SALE 50%</text>
  <rect x="190" y="110" width="160" height="210" fill="#e3f2fd"/>
  <rect x="200" y="120" width="140" height="32" fill="#2e7d32"/>
  <text x="270" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">+ PHARMACY</text>
  <rect x="215" y="170" width="110" height="140" fill="#bbdefb"/>
  <!-- shops right -->
  <rect x="450" y="100" width="170" height="220" fill="#fff9c4"/>
  <rect x="460" y="110" width="150" height="32" fill="#283593"/>
  <text x="535" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">MOBILE WORLD</text>
  <rect x="470" y="160" width="130" height="150" fill="#e8eaf6"/>
  <g fill="#3949ab"><rect x="485" y="180" width="18" height="30" rx="3"/><rect x="515" y="180" width="18" height="30" rx="3"/><rect x="545" y="180" width="18" height="30" rx="3"/></g>
  <rect x="630" y="80" width="170" height="240" fill="#d7ccc8"/>
  <rect x="640" y="90" width="150" height="32" fill="#4e342e"/>
  <text x="715" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">SPICE STORES</text>

  <!-- road + crossing -->
  <rect y="320" width="800" height="200" fill="#616161"/>
  <g fill="#fafafa"><rect x="360" y="330" width="16" height="180"/><rect x="392" y="330" width="16" height="180"/><rect x="424" y="330" width="16" height="180"/></g>
  <rect y="520" width="800" height="80" fill="#bdbdbd"/>

  <!-- red bus -->
  <rect x="470" y="330" width="300" height="120" rx="14" fill="#c62828"/>
  <g fill="#b3e5fc"><rect x="490" y="345" width="50" height="40"/><rect x="550" y="345" width="50" height="40"/><rect x="610" y="345" width="50" height="40"/><rect x="670" y="345" width="80" height="40"/></g>
  <text x="620" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffeb3b">138 · KOTTAWA</text>
  <circle cx="530" cy="452" r="20" fill="#212121"/><circle cx="710" cy="452" r="20" fill="#212121"/>
  <!-- yellow tuk-tuk -->
  <path d="M120 440 l0 -60 q0 -30 40 -30 l60 0 q30 0 30 30 l0 60z" fill="#fbc02d"/>
  <rect x="140" y="365" width="60" height="35" fill="#b3e5fc"/>
  <circle cx="140" cy="445" r="16" fill="#212121"/><circle cx="235" cy="445" r="16" fill="#212121"/>
